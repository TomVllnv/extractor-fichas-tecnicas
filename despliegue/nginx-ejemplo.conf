# EJEMPLO de Nginx para Informática: no activarlo sin un dominio y
# certificados TLS emitidos o aprobados por el CRS.
# Solo muestra el bloque HTTPS; TI debe definir su política HTTP -> HTTPS.
server {
    listen 443 ssl;
    server_name fichastecnicas.ejemplo.interno;  # Reemplazar por dominio real

    ssl_certificate     /ruta/segura/certificado.crt;  # Definir en servidor
    ssl_certificate_key /ruta/segura/clave_privada.key; # Nunca poner en Git/ZIP

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

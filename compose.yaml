# Un solo contenedor Streamlit y un volumen persistente de datos SQLite.
# El servidor web escucha internamente en 8501; solo se publica en loopback.
# TI debe poner un proxy inverso HTTPS delante para ofrecer acceso institucional.
services:
  herramienta:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${OCR_HOST:-127.0.0.1}:${OCR_PORT:-8501}:8501"
    environment:
      HERRAMIENTA_DB_PATH: /datos/base_de_datos.db
      HERRAMIENTA_BACKUP_DIR: /datos/respaldos
      TZ: America/Santiago
    volumes:
      - laboratorio_datos:/datos
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Mantener este nombre lógico: no cambiarlo al actualizar para reutilizar
# la base de datos de instalaciones anteriores con este mismo compose.yaml.
volumes:
  laboratorio_datos:

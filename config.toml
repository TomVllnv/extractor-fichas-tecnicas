# Paleta oscura neutra del entorno local; evita los fondos marrones
# de las versiones recientes de Streamlit al desplegar en Cloud.
# No afecta los estilos CSS particulares ni los datos de la aplicación.
[theme]
base = "dark"
primaryColor = "#FF4B4B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"

[theme.sidebar]
backgroundColor = "#262730"
secondaryBackgroundColor = "#0E1117"
textColor = "#FAFAFA"
